name: 기능 요청
description: 새 기능이나 기존 기능의 개선을 제안한다
title: "[기능] "
# 저장소마다 라벨 이름이 다르다. 저장소에 없는 라벨은 무시되므로 변형을 모두 적는다.
labels: ["enhancement", "⚡️ enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        "무엇을 만들까"보다 "어떤 문제를 풀까"를 먼저 적어 주세요.
        문제가 분명하면 더 나은 해법이 나올 수 있습니다.

  - type: textarea
    id: problem
    attributes:
      label: 배경 / 해결하려는 문제
      description: 누가, 어떤 상황에서, 무엇 때문에 불편한가요?
      placeholder: 예) 알림 규칙이 많아지면 어떤 규칙이 최근에 발생했는지 한눈에 보기 어렵다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작을 사용자 관점에서 적어 주세요. 화면 시안이 있으면 함께 붙여 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 방법이나 지금 쓰고 있는 우회 방법이 있다면 적어 주세요.

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 무엇이 되면 이 요청이 끝났다고 볼 수 있나요?
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - 급함 (일정·고객 요청에 걸려 있음)
        - 보통
        - 낮음 (있으면 좋음)

  - type: textarea
    id: extra
    attributes:
      label: 참고 자료
      description: 관련 이슈·PR, 고객 요청 출처, 다른 제품 사례 등을 붙여 주세요.
