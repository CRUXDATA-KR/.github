name: 버그 신고
description: 기대와 다르게 동작하는 것을 알린다
title: "[버그] "
# 저장소마다 버그 라벨 이름이 다르다. 저장소에 없는 라벨은 무시되므로 변형을 모두 적는다.
labels: ["bug", "🐛 bug", "🐞 bug"]
body:
  - type: markdown
    attributes:
      value: |
        재현할 수 있을 만큼 구체적으로 적어 주세요.
        로그·스크린샷을 붙이기 전에 **비밀번호, 토큰, 고객 데이터**는 지워 주세요.

  - type: textarea
    id: summary
    attributes:
      label: 무슨 일이 일어났나요?
      description: 문제를 한두 문장으로 요약해 주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 처음 보는 사람이 그대로 따라 할 수 있게 적어 주세요.
      placeholder: |
        1. '...' 화면으로 이동
        2. '...' 을 클릭
        3. '...' 입력 후 저장
        4. 오류 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 화면에 뜬 메시지, 응답 코드, 에러 코드를 그대로 옮겨 주세요.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 영향도
      options:
        - 서비스 중단 / 데이터 손상
        - 주요 기능 사용 불가
        - 불편하지만 우회 가능
        - 경미 (표시·문구 등)
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 발생 빈도
      options:
        - 항상 재현됨
        - 간헐적으로 발생
        - 한 번만 봤음
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 발생 환경
      options:
        - 로컬 개발 환경
        - 테스트 서버
        - 운영 서버
        - 고객사 환경
        - 기타
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 버전 / 커밋
      description: 릴리스 태그나 커밋 SHA. 모르면 비워 두세요.
      placeholder: 예) v1.1.4, 3f2a9c1

  - type: input
    id: client
    attributes:
      label: 브라우저 / OS
      placeholder: 예) Chrome 141 / macOS 26

  - type: textarea
    id: logs
    attributes:
      label: 로그
      description: 관련 로그를 붙여 주세요. 자동으로 코드 블록으로 감싸집니다.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: 스크린샷 / 추가 정보
      description: 스크린샷, 영상, 관련 이슈·PR 링크 등을 자유롭게 붙여 주세요.
