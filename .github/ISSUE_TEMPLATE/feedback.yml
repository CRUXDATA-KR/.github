name: 피드백
description: 2.0 기획안을 보고 UI 수정, 구현 우려, 기존 화면 유지 등 의견을 남긴다
title: "[피드백] "
# 저장소마다 라벨 이름이 다르다. 저장소에 없는 라벨은 무시되므로 변형을 모두 적는다.
labels: ["feedback", "💬 feedback"]
# 작성자에게 프로젝트 쓰기 권한이 있을 때만 자동 등록된다.
projects: ["CRUXDATA-KR/33"]
body:
  - type: markdown
    attributes:
      value: |
        기획안의 **어디를, 왜, 어떻게** 바꾸면 좋을지 적어 주세요.
        정답이 아니어도 괜찮습니다. 짧게라도 남겨 주시면 검토에 반영합니다.

  - type: dropdown
    id: screen
    attributes:
      label: 대상 화면
      options:
        - 홈
        - 로그
        - 대시보드
        - 알림
        - 데이터소스
        - 결재
        - 관리
        - 헤더
        - 사용자 설정
        - 기타
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 피드백 유형
      options:
        - UI/UX 수정 제안
        - 구현이 어렵거나 비용이 큼
        - 기존 화면 유지 제안
        - 기획 누락 또는 불명확
        - 기타
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 현재 기획안 내용
      description: 기획안에 어떻게 되어 있는지 한두 줄로 요약해 주세요.
      placeholder: 예) 알림 목록에서 규칙별 집계를 카드 형태로 보여준다.

  - type: textarea
    id: proposal
    attributes:
      label: 의견 / 제안
      description: 어떻게 바꾸면 좋을지 적어 주세요. 시안이 있으면 함께 붙여 주세요.
      placeholder: 예) 카드 대신 표로 보여주고 정렬·필터를 제공하면 좋겠다.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 이유 / 근거
      description: 사용자 관점의 불편, 기술 제약, 기존 운영 경험 등 제안의 배경을 적어 주세요.
      placeholder: |
        예) 규칙이 수십 개가 넘으면 카드로는 비교가 어렵다.
        예) 집계 쿼리가 무거워 실시간 갱신은 구현 비용이 크다.
        예) 기존 화면의 표 구성에 익숙한 사용자가 많다.

  - type: textarea
    id: extra
    attributes:
      label: 스크린샷 / 참고
      description: 시안, 기존 화면 캡처, 관련 이슈·PR 링크 등을 자유롭게 붙여 주세요.
